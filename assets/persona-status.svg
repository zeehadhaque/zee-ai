<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" height="auto">
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F80FF" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .persona-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 800; fill: #F8FAFC; letter-spacing: 1px; }
    .persona-badge { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; }
    .persona-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94A3B8; }
    .bridge-text { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #CBD5E1; letter-spacing: 1.5px; }
  </style>

  <!-- Container Box -->
  <rect width="920" height="110" rx="10" fill="#080D1A" stroke="#1E293B" stroke-width="1.2" />

  <!-- Left Persona: ZEE -->
  <g transform="translate(25, 20)">
    <rect width="275" height="70" rx="8" fill="#0B1120" stroke="#2F80FF" stroke-width="1.2" filter="url(#cardGlow)" />
    <!-- Avatar Icon -->
    <circle cx="34" cy="35" r="18" fill="#0F172A" stroke="#2F80FF" stroke-width="1.5" />
    <text x="34" y="40" fill="#60A5FA" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle">Z</text>
    
    <!-- Meta -->
    <text x="65" y="30" class="persona-title">ZEE</text>
    <rect x="105" y="17" width="105" height="18" rx="4" fill="#1E293B" />
    <text x="112" y="30" fill="#60A5FA" class="persona-badge">OPERATIONAL CORE</text>
    
    <text x="65" y="52" class="persona-desc">Voice Wake • Phone Ops • Logic &amp; Code</text>
  </g>

  <!-- Central Bridge Signal Flow -->
  <g transform="translate(315, 35)">
    <!-- Base track -->
    <line x1="0" y1="20" x2="290" y2="20" stroke="#1E293B" stroke-width="2" />
    <!-- Flowing animated gradient pulse -->
    <line x1="0" y1="20" x2="290" y2="20" stroke="url(#linkGrad)" stroke-width="2.5" stroke-dasharray="16 12">
      <animate attributeName="stroke-dashoffset" from="56" to="0" dur="2s" repeatCount="indefinite" />
    </line>

    <!-- Center Bridge Chip -->
    <rect x="75" y="5" width="140" height="30" rx="15" fill="#060913" stroke="#334155" stroke-width="1.2" />
    <circle cx="92" cy="20" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="162" y="24" class="bridge-text" text-anchor="middle">ROOM DB SYNC</text>
  </g>

  <!-- Right Persona: ZHEE -->
  <g transform="translate(620, 20)">
    <rect width="275" height="70" rx="8" fill="#0B1120" stroke="#8B5CF6" stroke-width="1.2" filter="url(#cardGlow)" />
    <!-- Avatar Icon -->
    <circle cx="34" cy="35" r="18" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="34" y="40" fill="#C084FC" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle">ZH</text>
    
    <!-- Meta -->
    <text x="65" y="30" class="persona-title">ZHEE</text>
    <rect x="115" y="17" width="95" height="18" rx="4" fill="#1E293B" />
    <text x="122" y="30" fill="#C084FC" class="persona-badge">CREATIVE CORE</text>
    
    <text x="65" y="52" class="persona-desc">Filmmaker Studio • YouTube • AI Council</text>
  </g>
</svg>
