<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="auto">
  <defs>
    <linearGradient id="installBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .step-pill { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .card-h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #F8FAFC; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94A3B8; line-height: 1.4; }
    .step-badge { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; fill: #60A5FA; }
    .header-tag2 { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #2F80FF; letter-spacing: 2px; }
  </style>

  <!-- Container Background -->
  <rect width="920" height="230" rx="10" fill="url(#installBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Top Title Strip -->
  <g transform="translate(25, 22)">
    <circle cx="5" cy="5" r="3.5" fill="#2F80FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="9" class="header-tag2">DIRECT PHONE INSTALLATION &amp; ONBOARDING PROTOCOL</text>
  </g>

  <!-- STEP 1: TRIGGER BUILD -->
  <g transform="translate(25, 45)">
    <rect width="275" height="165" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.2" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="60" height="20" rx="4" fill="#1E293B" />
    <text x="22" y="28" fill="#60A5FA" class="step-pill">STEP 01</text>
    <!-- Cloud Icon -->
    <path d="M 235 24 A 8 8 0 0 1 250 24 A 6 6 0 0 1 256 30 L 228 30 A 6 6 0 0 1 235 24 Z" fill="none" stroke="#60A5FA" stroke-width="1.5" />
    
    <text x="14" y="58" class="card-h1">Trigger Cloud Build</text>
    <text x="14" y="78" class="card-body">Push any new commit to main or push</text>
    <text x="14" y="94" class="card-body">a version tag:</text>
    <rect x="14" y="104" width="245" height="24" rx="4" fill="#060913" stroke="#1E293B" stroke-width="1" />
    <text x="22" y="120" class="step-badge">git tag v1.0.0 &amp;&amp; git push origin v1.0.0</text>
    <text x="14" y="146" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10.5">Or tap 'Run workflow' in Actions tab.</text>
  </g>

  <!-- STEP 2: DOWNLOAD ARTIFACT -->
  <g transform="translate(322, 45)">
    <rect width="275" height="165" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.2" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="60" height="20" rx="4" fill="#1E293B" />
    <text x="22" y="28" fill="#A78BFA" class="step-pill">STEP 02</text>
    <!-- Download Icon -->
    <path d="M 242 16 L 242 28 M 238 24 L 242 28 L 246 24 M 234 31 L 250 31" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="14" y="58" class="card-h1">Download APK</text>
    <text x="14" y="78" class="card-body">1. Open browser on your phone.</text>
    <text x="14" y="94" class="card-body">2. Go to github.com/.../zee-ai/actions</text>
    <text x="14" y="110" class="card-body">3. Tap completed build run.</text>
    <rect x="14" y="122" width="245" height="24" rx="4" fill="#060913" stroke="#1E293B" stroke-width="1" />
    <text x="22" y="138" fill="#A78BFA" class="step-badge">Artifacts ➔ zee-ai-&lt;sha&gt;.zip</text>
  </g>

  <!-- STEP 3: SIDELOAD & PERMISSIONS -->
  <g transform="translate(620, 45)">
    <rect width="275" height="165" rx="8" fill="#0B1120" stroke="#34D399" stroke-width="1.2" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="60" height="20" rx="4" fill="#064E3B" />
    <text x="22" y="28" fill="#34D399" class="step-pill">STEP 03</text>
    <!-- Mobile Icon -->
    <rect x="238" y="16" width="12" height="18" rx="2" fill="none" stroke="#34D399" stroke-width="1.5" />
    <circle cx="244" cy="30" r="1" fill="#34D399" />

    <text x="14" y="58" class="card-h1">Sideload &amp; Setup</text>
    <text x="14" y="78" class="card-body">1. Tap APK to install from file manager.</text>
    <text x="14" y="96" class="card-body">2. Grant <tspan fill="#F8FAFC" font-weight="600">Microphone</tspan> permission.</text>
    <text x="14" y="114" class="card-body">3. Settings ➔ Accessibility ➔ Enable</text>
    <text x="26" y="130" fill="#34D399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">'ZEE AI System Service'</text>
    <text x="14" y="148" class="card-body">4. Add Gemini API Key or use Offline.</text>
  </g>
</svg>
