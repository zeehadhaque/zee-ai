<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F80FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .arch-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #2F80FF; letter-spacing: 2px; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 800; fill: #F8FAFC; letter-spacing: 0.5px; }
    .layer-chip { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 600; }
    .layer-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
  </style>

  <!-- Container Box -->
  <rect width="920" height="280" rx="12" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header Title -->
  <g transform="translate(25, 22)">
    <circle cx="5" cy="5" r="3.5" fill="#2F80FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="9" class="arch-tag">MODULAR CLEAN ARCHITECTURE • COM.ZEEAI.COMPANION</text>
  </g>

  <!-- 5 HORIZONTAL STACKED TIERS / MODULES -->

  <!-- TIER 1: UI & PRESENTATION LAYER -->
  <g transform="translate(25, 42)">
    <rect width="870" height="40" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <rect x="8" y="8" width="160" height="24" rx="4" fill="#1E293B" />
    <text x="18" y="24" fill="#60A5FA" class="layer-title">UI &amp; PRESENTATION</text>
    <text x="180" y="24" class="layer-desc">100% Jetpack Compose • Material 3 Skia Surfaces • Single Activity • Noir Cinematic Theme</text>
    <rect x="740" y="8" width="120" height="24" rx="4" fill="#060913" stroke="#2F80FF" stroke-width="1" />
    <text x="752" y="24" fill="#60A5FA" class="layer-chip">ZERO WEBVIEW</text>
  </g>

  <!-- TIER 2: PERSONA & VOICE SUBSYSTEM -->
  <g transform="translate(25, 88)">
    <rect width="870" height="40" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <rect x="8" y="8" width="160" height="24" rx="4" fill="#1E293B" />
    <text x="18" y="24" fill="#C084FC" class="layer-title">VOICE &amp; PERSONAS</text>
    <text x="180" y="24" class="layer-desc">ZEE [System Ops] &amp; ZHEE [Auteur] • Low-Power AudioRecord • Low-Latency Persona Speech TTS</text>
    <rect x="740" y="8" width="120" height="24" rx="4" fill="#060913" stroke="#8B5CF6" stroke-width="1" />
    <text x="752" y="24" fill="#C084FC" class="layer-chip">DUAL IDENTITY</text>
  </g>

  <!-- TIER 3: NEURAL ENGINE & COUNCIL -->
  <g transform="translate(25, 134)">
    <rect width="870" height="40" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <rect x="8" y="8" width="160" height="24" rx="4" fill="#1E293B" />
    <text x="18" y="24" fill="#34D399" class="layer-title">HYBRID BRAIN CORE</text>
    <text x="180" y="24" class="layer-desc">Online Gemini Streaming &amp; Search Grounding ⟷ Offline On-Device MediaPipe LLM ⟷ AI Council Debate</text>
    <rect x="740" y="8" width="120" height="24" rx="4" fill="#060913" stroke="#10B981" stroke-width="1" />
    <text x="752" y="24" fill="#34D399" class="layer-chip">DUAL-STACK AI</text>
  </g>

  <!-- TIER 4: OS ACCESSIBILITY ENGINE -->
  <g transform="translate(25, 180)">
    <rect width="870" height="40" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <rect x="8" y="8" width="160" height="24" rx="4" fill="#1E293B" />
    <text x="18" y="24" fill="#FBBF24" class="layer-title">AOSP KERNEL OPS</text>
    <text x="180" y="24" class="layer-desc">AccessibilityService • Node Tree Inspector • GestureDescription Taps &amp; Swipes • Biometric Interceptors</text>
    <rect x="740" y="8" width="120" height="24" rx="4" fill="#060913" stroke="#F59E0B" stroke-width="1" />
    <text x="748" y="24" fill="#FBBF24" class="layer-chip">PHONE CONTROL</text>
  </g>

  <!-- TIER 5: DATA, STUDIOS & STORAGE BOUNDARY -->
  <g transform="translate(25, 226)">
    <rect width="870" height="40" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <rect x="8" y="8" width="160" height="24" rx="4" fill="#1E293B" />
    <text x="18" y="24" fill="#22D3EE" class="layer-title">DATA &amp; STUDIOS</text>
    <text x="180" y="24" class="layer-desc">ZEE Cinema (Veo 2 • Sora) • YouTube Data API • Room DB v2.6 • Scoped Storage SAF • Zero Localhost</text>
    <rect x="740" y="8" width="120" height="24" rx="4" fill="#060913" stroke="#06B6D4" stroke-width="1" />
    <text x="748" y="24" fill="#22D3EE" class="layer-chip">PERSISTENCE</text>
  </g>
</svg>
