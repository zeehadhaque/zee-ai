<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 135" width="100%" height="auto">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <filter id="secGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .sec-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sec-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #94A3B8; }
    .sec-header { font-family: 'SF Mono', Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #10B981; letter-spacing: 2px; }
  </style>

  <!-- Container Box -->
  <rect width="920" height="135" rx="10" fill="url(#secBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Top Title Strip -->
  <g transform="translate(25, 20)">
    <circle cx="5" cy="5" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="9" class="sec-header">SECURITY &amp; SYSTEM SOVEREIGNTY ARCHITECTURE</text>
  </g>

  <!-- 3 CARDS -->

  <!-- CARD 1: Zero Telemetry -->
  <g transform="translate(25, 38)">
    <rect width="275" height="82" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="30" cy="41" r="16" fill="#0F172A" stroke="#10B981" stroke-width="1.4" filter="url(#secGlow)" />
    <!-- Shield / Slash Icon -->
    <path d="M 30 31 L 38 34 L 38 42 C 38 47 30 51 30 51 C 30 51 22 47 22 42 L 22 34 Z" fill="none" stroke="#34D399" stroke-width="1.4" />
    <text x="56" y="32" class="sec-title">Zero Telemetry</text>
    <text x="56" y="49" class="sec-desc">No tracking SDKs, Firebase Analytics,</text>
    <text x="56" y="65" class="sec-desc">or hidden data egress. Pure local trust.</text>
  </g>

  <!-- CARD 2: Biometric Interceptors -->
  <g transform="translate(322, 38)">
    <rect width="275" height="82" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="30" cy="41" r="16" fill="#0F172A" stroke="#2F80FF" stroke-width="1.4" filter="url(#secGlow)" />
    <!-- Fingerprint Icon -->
    <path d="M 27 46 C 27 38 33 38 33 46 M 24 43 C 24 33 36 33 36 43 M 30 46 C 30 42 30 42 30 46" fill="none" stroke="#60A5FA" stroke-width="1.4" stroke-linecap="round" />
    <text x="56" y="32" class="sec-title">Biometric Gates</text>
    <text x="56" y="49" class="sec-desc">Sensitive actions require native AOSP</text>
    <text x="56" y="65" class="sec-desc"><tspan fill="#60A5FA">BiometricPrompt</tspan> confirmation.</text>
  </g>

  <!-- CARD 3: Physical Mute -->
  <g transform="translate(620, 38)">
    <rect width="275" height="82" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="30" cy="41" r="16" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4" filter="url(#secGlow)" />
    <!-- Mic Off Icon -->
    <line x1="22" y1="33" x2="38" y2="49" stroke="#FBBF24" stroke-width="1.6" />
    <path d="M 34 35 L 34 32 A 4 4 0 0 0 27 34 M 26 39 A 4 4 0 0 0 34 43 M 30 43 L 30 49" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-linecap="round" />
    <text x="56" y="32" class="sec-title">Hardware Mute</text>
    <text x="56" y="49" class="sec-desc">AudioRecord pipeline releases physical</text>
    <text x="56" y="65" class="sec-desc">microphone immediately on pause.</text>
  </g>
</svg>
