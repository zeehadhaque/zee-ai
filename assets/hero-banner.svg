<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <!-- Obsidian Blue Accent Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2F80FF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Persona Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F80FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 54px; font-weight: 900; letter-spacing: 2px; fill: #F8FAFC; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #94A3B8; }
    .mono-chip { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 600; fill: #CBD5E1; }
    .eyebrow-text { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; letter-spacing: 3px; fill: #2F80FF; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="300" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Reticle Matrix -->
  <g opacity="0.1" stroke="#60A5FA" stroke-width="0.75">
    <line x1="60" y1="0" x2="60" y2="300" />
    <line x1="180" y1="0" x2="180" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="420" y1="0" x2="420" y2="300" />
    <line x1="540" y1="0" x2="540" y2="300" />
    <line x1="660" y1="0" x2="660" y2="300" />
    <line x1="780" y1="0" x2="780" y2="300" />
    <line x1="0" y1="60" x2="920" y2="60" />
    <line x1="0" y1="120" x2="920" y2="120" />
    <line x1="0" y1="180" x2="920" y2="180" />
    <line x1="0" y1="240" x2="920" y2="240" />
  </g>

  <!-- Subtle Scanline Texture -->
  <rect width="920" height="300" fill="url(#scanlines)" rx="14" pointer-events="none" />

  <!-- Animated Horizon Orbit -->
  <g opacity="0.35">
    <ellipse cx="460" cy="285" rx="380" ry="55" fill="none" stroke="#2F80FF" stroke-width="1.2" stroke-dasharray="10 14">
      <animateTransform attributeName="transform" type="rotate" from="0 460 285" to="360 460 285" dur="30s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="460" cy="285" rx="260" ry="36" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 460 285" to="0 460 285" dur="20s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Left Side: Animated Neural Aperture (Crest) -->
  <g transform="translate(100, 145)">
    <!-- Base Core -->
    <circle cx="0" cy="0" r="46" fill="#091122" stroke="#1E293B" stroke-width="2">
      <animate attributeName="r" values="44;49;44" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Outer Cyan Ring with Pulse -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#2F80FF" stroke-width="1.8" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="4 8; 18 4; 4 8" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Violet Counter-Rotating Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="10 4; 2 6; 10 4" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Z Monogram Vector Icon -->
    <path d="M -12 -13 L 12 -13 L -12 13 L 12 13" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animate attributeName="stroke" values="#FFFFFF;#60A5FA;#E2E8F0;#FFFFFF" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Orbiting Satellite Particle -->
    <circle cx="36" cy="0" r="3.5" fill="#60A5FA">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Header & Typography Content -->
  <g transform="translate(185, 0)">
    <!-- Eyebrow Tag -->
    <text x="0" y="70" class="eyebrow-text">100% PURE NATIVE ANDROID • ZERO WEBVIEW</text>

    <!-- Main Title: ZEE AI -->
    <text x="0" y="130" class="title-text">ZEE AI</text>
    <text x="215" y="130" fill="#64748B" font-family="-apple-system, sans-serif" font-size="20" font-weight="300" letter-spacing="4">/ COMPANION</text>

    <!-- Tagline description -->
    <text x="0" y="165" class="tagline-text">Autonomous Phone Navigation &amp; Dual-Persona Voice Core (ZEE &amp; ZHEE).</text>
    <text x="0" y="187" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12.5">Engineered with Kotlin 2.0 • Jetpack Compose • AccessibilityService • Room • Gemini &amp; MediaPipe.</text>

    <!-- Bottom Telemetry Chips -->
    <g transform="translate(0, 218)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="144" height="28" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" class="mono-chip">AOSP KERNEL ACC</text>

      <!-- Chip 2 -->
      <rect x="154" y="0" width="144" height="28" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
      <circle cx="168" cy="14" r="3.5" fill="#2F80FF" />
      <text x="182" y="18" class="mono-chip">ZERO LOCALHOST</text>

      <!-- Chip 3 -->
      <rect x="308" y="0" width="148" height="28" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
      <circle cx="322" cy="14" r="3.5" fill="#8B5CF6">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="336" y="18" class="mono-chip">MEDIAPIPE OFFLINE</text>

      <!-- Chip 4 -->
      <rect x="466" y="0" width="170" height="28" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
      <circle cx="480" cy="14" r="3.5" fill="#F59E0B" />
      <text x="494" y="18" class="mono-chip">SEARCH GROUNDING</text>
    </g>
  </g>

  <!-- Live Pulse Waveform Reticle (Right Side) -->
  <g transform="translate(805, 80)">
    <path d="M 0 40 Q 15 10 30 40 T 60 40 T 90 40" fill="none" stroke="url(#waveGrad)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="d" 
        values="M 0 40 Q 15 5 30 40 T 60 40 T 90 40;
                M 0 40 Q 15 50 30 40 T 60 15 T 90 40;
                M 0 40 Q 15 10 30 40 T 60 40 T 90 40" 
        dur="2.5s" repeatCount="indefinite" />
    </path>
    <text x="45" y="70" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">AUDIO FLUX</text>
  </g>
</svg>
