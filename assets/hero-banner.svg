<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#070D1D" />
      <stop offset="100%" stop-color="#03050C" />
    </linearGradient>
    <radialGradient id="cyanAura" cx="78%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldAura" cx="20%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.13" />
    </pattern>
    <pattern id="carbonDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#94A3B8" opacity="0.12" />
    </pattern>
    <pattern id="crtLines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.3" opacity="0.38" />
    </pattern>
    <clipPath id="frameClip"><rect width="960" height="320" rx="18" /></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="960" height="320" fill="url(#bgObsidian)" />
    <rect width="960" height="320" fill="url(#microGrid)" />
    <rect width="960" height="320" fill="url(#carbonDots)" />
    <rect width="960" height="320" fill="url(#cyanAura)" />
    <rect width="960" height="320" fill="url(#goldAura)" />
    <rect width="960" height="320" fill="url(#crtLines)" />

    <!-- Animated Vertical Radar Sweep -->
    <rect x="-120" y="0" width="120" height="320" fill="url(#scanSweep)" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1180 0" dur="5.5s" repeatCount="indefinite" />
    </rect>

    <!-- Corner HUD Target Brackets -->
    <g stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 18 44 L 18 18 L 48 18" />
      <path d="M 912 18 L 942 18 L 942 44" stroke="#FFB300" />
      <path d="M 18 276 L 18 302 L 48 302" />
      <path d="M 912 302 L 942 302 L 942 276" stroke="#818CF8" />
    </g>

    <!-- Top Specular Prism Strip -->
    <rect x="48" y="18" width="864" height="2" rx="1" fill="url(#prismGrad)" opacity="0.75" />

    <!-- Left Typography Block -->
    <text x="52" y="68" font-family="'SF Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="3.2" fill="#00E5FF">
      BUILD 16 • OBSIDIAN LIQUID GLASS • PURE NATIVE ANDROID
    </text>

    <text x="50" y="132" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="56" font-weight="900" letter-spacing="2" fill="#F8FAFC">
      ZEE <tspan fill="url(#prismGrad)">AI</tspan>
    </text>

    <text x="52" y="168" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#CBD5E1">
      3D Arc Reactor &amp; Suit Bust HUD • 9 Stark Superpowers • Hermes Evolution
    </text>
    <text x="52" y="192" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">
      On-Device Gemma Offline Cortex • Sherpa-ONNX Neural Voices • Loyal "Boss" Persona
    </text>

    <!-- Luxury Feature Glass Chips -->
    <g font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700">
      <rect x="52" y="218" width="136" height="30" rx="15" fill="#0B1221" stroke="#00E5FF" stroke-opacity="0.6" />
      <circle cx="68" cy="233" r="4" fill="#00E676">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <text x="80" y="237" fill="#F8FAFC">3D HOLOGRAM HUD</text>

      <rect x="198" y="218" width="142" height="30" rx="15" fill="#0B1221" stroke="#818CF8" stroke-opacity="0.6" />
      <text x="214" y="237" fill="#C7D2FE">9 STARK TOOLS</text>

      <rect x="350" y="218" width="150" height="30" rx="15" fill="#0B1221" stroke="#FFB300" stroke-opacity="0.6" />
      <text x="366" y="237" fill="#FDE68A">GEMMA + 8 PROVIDERS</text>

      <rect x="510" y="218" width="128" height="30" rx="15" fill="#0B1221" stroke="#C084FC" stroke-opacity="0.6" />
      <text x="525" y="237" fill="#F3E8FF">PLAY PROTECT OK</text>
    </g>

    <text x="52" y="284" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#64748B">
      com.zeeai.companion • Kotlin 2.0 + Jetpack Compose Material 3 • Android 8.0–16 Ready
    </text>

    <!-- Right Animated Arc Reactor Gyroscope Core -->
    <g transform="translate(778, 160)">
      <circle cx="0" cy="0" r="108" fill="none" stroke="#00E5FF" stroke-opacity="0.16" stroke-width="1.2" />
      <circle cx="0" cy="0" r="94" fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="32 14 10 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="76" fill="none" stroke="#818CF8" stroke-opacity="0.65" stroke-width="2.2" stroke-dasharray="22 18">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#FFB300" stroke-opacity="0.72" stroke-width="2" stroke-dasharray="14 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite" />
      </circle>
      <!-- Pulsing Core Singularity -->
      <circle cx="0" cy="0" r="36" fill="#00E5FF" fill-opacity="0.18">
        <animate attributeName="r" values="32;40;32" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="24" fill="#02040A" stroke="#00E5FF" stroke-width="2.5" />
      <circle cx="0" cy="0" r="10" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;0.55;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <!-- Orbiting Satellite Node -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite" />
        <circle cx="94" cy="0" r="4.5" fill="#00E676" />
        <circle cx="-76" cy="0" r="3.5" fill="#FFB300" />
      </g>
    </g>
  </g>
  <rect width="960" height="320" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5" />
</svg>